<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ütle design mock v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap"
    />
    <style>
      /*
       * Ütle, design mock v2. The document is the screen; Ütle is the bar at the bottom.
       * Palette and manners follow EFS: warm ivory or obsidian ground, near-black ink,
       * hairlines instead of boxes, colour only where something needs attention.
       */
      :root {
        --ground: #f7f5f0;
        --ink: #141517;
        --soft: #5c625f;
        --line: #e6e3da;
        --line-strong: #c9c5b8;
        --red: #b3261e; /* removed text, the listening dots */
        --blue: #1a5fb4; /* added text, focus */
        --mark: #ffe04a; /* which of these */
        --mark-ink: #141517;
        --glass: rgba(247, 245, 240, 0.94);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --ground: #0e0f11;
          --ink: #ece9e2;
          --soft: #a19f97;
          --line: #26292e;
          --line-strong: #34383f;
          --red: #f2857c;
          --blue: #6fa8f0;
          --glass: rgba(14, 15, 17, 0.94);
        }
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --ground: #0e0f11;
        --ink: #ece9e2;
        --soft: #a19f97;
        --line: #26292e;
        --line-strong: #34383f;
        --red: #f2857c;
        --blue: #6fa8f0;
        --glass: rgba(14, 15, 17, 0.94);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', Verdana, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }

      /* ---- Mock scaffolding. Not part of the design. ---- */
      .mock {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem 0.5rem;
        padding: 0.4rem 1.25rem;
        border-bottom: 1px dashed var(--line-strong);
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        color: var(--soft);
      }

      .mock button {
        cursor: pointer;
        border: 1px solid transparent;
        background: none;
        padding: 0.1rem 0.4rem;
        font: inherit;
        color: var(--soft);
      }

      .mock button[aria-pressed='true'] {
        border-color: var(--line-strong);
        color: var(--ink);
      }

      .mock span {
        margin-left: 0.75rem;
      }

      .mock span:first-child {
        margin-left: 0;
      }

      /* ---- The page: nothing but the document and its margin. ---- */
      .page {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 11rem;
      }

      .top {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.5rem 2rem;
        padding-left: 3.25rem;
        color: var(--soft);
        font-size: 0.875rem;
      }

      .top nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1.5rem;
      }

      .quiet {
        cursor: pointer;
        border: 0;
        background: none;
        padding: 0;
        color: var(--soft);
        text-decoration: none;
      }

      .quiet:hover {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .quiet[aria-pressed='true'] {
        color: var(--ink);
        font-weight: 600;
      }

      .langs {
        display: flex;
        gap: 0.75rem;
      }

      .desk {
        display: grid;
        grid-template-columns: minmax(0, 43rem) minmax(13rem, 1fr);
        align-items: start;
        gap: 2.5rem 4.5rem;
        margin-top: 3rem;
      }

      /* The document. No sheet, no box: the text sits on the ground. */
      .doc {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        font-size: 18px;
        line-height: 1.65;
      }

      .row {
        display: grid;
        grid-template-columns: 1.75rem minmax(0, 1fr);
        align-items: baseline;
        gap: 0 1.5rem;
      }

      .num {
        text-align: right;
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
        color: var(--soft);
      }

      .text {
        position: relative;
        max-width: 62ch;
      }

      /* The change bar: present only where a paragraph carries a state. */
      .text::before {
        content: '';
        position: absolute;
        left: -0.8rem;
        top: 0.3em;
        bottom: 0.3em;
        width: 2px;
        background: transparent;
      }

      .row[data-tone='changed'] .text::before,
      .row[data-tone='added'] .text::before {
        background: var(--blue);
      }

      .row[data-tone='removed'] .text::before {
        background: var(--red);
      }

      .row[data-tone='ask'] .text::before {
        background: var(--mark);
      }

      .row[data-tone='focus'] .text::before {
        background: var(--ink);
      }

      .row[data-tone='focus'] .num {
        color: var(--ink);
        font-weight: 800;
      }

      .row[data-type='h1'] .text {
        font-size: 1.75rem;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.015em;
      }

      .row[data-type='h2'] {
        margin-top: 1.1rem;
      }

      .row[data-type='h2'] .text {
        font-size: 1.125rem;
        font-weight: 600;
      }

      .row[data-type='li'] .text {
        padding-left: 1.25rem;
        text-indent: -1.25rem;
      }

      .row[data-type='li'] .text > .bullet {
        display: inline-block;
        width: 1.25rem;
        text-indent: 0;
        color: var(--soft);
      }

      del {
        color: var(--red);
        text-decoration: line-through;
        text-decoration-thickness: 0.08em;
      }

      ins {
        color: var(--blue);
        text-decoration: underline;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }

      del + ins {
        margin-left: 0.3em;
      }

      .highlight {
        background: var(--mark);
        color: var(--mark-ink);
        padding: 0.08em 0.14em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }

      .badge {
        display: inline-block;
        min-width: 1.4em;
        margin-right: 0.35em;
        padding: 0 0.3em;
        background: var(--mark-ink);
        color: var(--mark);
        text-align: center;
        font-size: 0.8em;
        font-weight: 800;
      }

      /* The margin: notes beside the text, in the voice of a proofreader's column. */
      .margin {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        padding-top: 0.35rem;
        font-size: 0.875rem;
        color: var(--soft);
      }

      .margin h2 {
        margin: 0 0 0.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--ink);
      }

      .margin ol,
      .margin dl {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .margin ol li {
        padding: 0.45rem 0;
        border-top: 1px solid var(--line);
        color: var(--ink);
      }

      .margin ol li:last-child {
        border-bottom: 1px solid var(--line);
      }

      .margin dl div {
        padding: 0.45rem 0;
        border-top: 1px solid var(--line);
      }

      .margin dd {
        margin: 0;
        color: var(--ink);
      }

      .tally {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.1rem 0.6rem;
        margin: 0;
      }

      .tally b {
        text-align: right;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      /* ---- Ütle itself: one bar. This is the part that could later sit over any program. ---- */
      .bar {
        position: fixed;
        inset: auto 0 0 0;
        border-top: 1px solid var(--line-strong);
        background: var(--glass);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .bar-in {
        display: grid;
        grid-template-columns: 3.25rem minmax(0, 1fr) auto;
        align-items: baseline;
        gap: 0.1rem 0;
        max-width: 72rem;
        margin: 0 auto;
        padding: 1rem 1.25rem 1.1rem;
      }

      .wordmark {
        grid-column: 1;
        grid-row: 2;
        font-weight: 800;
        font-size: 1.375rem;
        line-height: 1.35;
        letter-spacing: -0.03em;
        user-select: none;
      }

      .wordmark-u {
        position: relative;
        display: inline-block;
      }

      .dots {
        position: absolute;
        inset-inline: 0;
        top: 0.1em;
        display: flex;
        justify-content: center;
        gap: 0.11em;
      }

      .dots i {
        width: 0.2em;
        height: 0.2em;
        border-radius: 50%;
        background: var(--red);
      }

      [data-voice='off'] .dots i {
        background: transparent;
        box-shadow: inset 0 0 0 0.05em var(--soft);
      }

      [data-voice='hearing'] .dots i {
        animation: swell 0.9s ease-in-out infinite alternate;
      }

      [data-voice='hearing'] .dots i + i {
        animation-delay: 0.12s;
      }

      [data-voice='thinking'] .dots i {
        animation: think 0.7s ease-in-out infinite alternate;
      }

      [data-voice='thinking'] .dots i + i {
        animation-delay: 0.35s;
      }

      @keyframes swell {
        0% { transform: scale(1); }
        35% { transform: scale(1.7); }
        60% { transform: scale(1.15); }
        100% { transform: scale(1.5); }
      }

      @keyframes think {
        from { opacity: 1; }
        to { opacity: 0.25; }
      }

      @media (prefers-reduced-motion: reduce) {
        .dots i {
          animation: none !important;
        }
      }

      /* The wordmark shares a baseline with the first line of the answer, however long it runs. */
      .said {
        display: contents;
      }

      .heard,
      .answer {
        grid-column: 2;
        min-width: 0;
        padding-right: 2.5rem;
      }

      .heard {
        grid-row: 1;
        margin: 0;
        min-height: 1.5em;
        color: var(--soft);
        font-size: 1rem;
      }

      .answer {
        grid-row: 2;
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.35;
      }

      .answer b {
        font-weight: 600;
      }

      .answer span {
        color: var(--soft);
      }

      .acts {
        grid-column: 3;
        grid-row: 1 / span 2;
        align-self: end;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .yes,
      .no {
        cursor: pointer;
        min-width: 4.25rem;
        padding: 0.4rem 1rem;
        border: 1px solid var(--ink);
        background: none;
        font-weight: 600;
      }

      .yes {
        background: var(--ink);
        color: var(--ground);
      }

      .no {
        border-color: var(--line-strong);
      }

      .typed {
        width: 13.5rem;
        margin-left: 0.9rem;
        padding: 0.4rem 0;
        border: 0;
        border-bottom: 1px solid var(--line-strong);
        border-radius: 0;
        background: none;
        font-size: 0.875rem;
      }

      .typed::placeholder {
        color: var(--soft);
        opacity: 1;
      }

      .typed:focus {
        outline: 0;
        border-bottom-color: var(--ink);
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 1000px) {
        .desk {
          grid-template-columns: minmax(0, 1fr);
        }

        .margin {
          padding-left: 3.25rem;
          max-width: 30rem;
        }
      }

      @media (max-width: 700px) {
        .page {
          padding-bottom: 14rem;
        }

        .top {
          padding-left: 0;
        }

        .desk {
          margin-top: 2rem;
        }

        .doc {
          font-size: 17px;
        }

        .row {
          gap: 0 1.1rem;
          grid-template-columns: 1.25rem minmax(0, 1fr);
        }

        .margin {
          padding-left: 2.35rem;
        }

        .bar-in {
          grid-template-columns: 3.25rem minmax(0, 1fr);
          padding: 0.75rem 1.25rem 0.9rem;
        }

        .heard,
        .answer {
          padding-right: 0;
        }

        .answer {
          font-size: 1.1rem;
        }

        .acts {
          grid-column: 2;
          grid-row: 3;
          margin-top: 0.6rem;
          flex-wrap: wrap;
        }

        .typed {
          flex: 1 1 8rem;
          width: auto;
          margin-left: 0;
        }

        .acts .yes + .no + .typed {
          margin-left: 0.3rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="mock" aria-label="Mock controls, not part of the design">
      <span>mock state</span>
      <div id="states"></div>
      <span>theme</span>
      <div id="themes"></div>
      <span>keys 1 to 8, t</span>
    </div>

    <div class="page">
      <div class="top">
        <span>minutes-5-october.docx, every change is tracked</span>
        <nav aria-label="Controls">
          <div class="langs" role="group" aria-label="Language">
            <button type="button" class="quiet" aria-pressed="true">English</button>
            <button type="button" class="quiet" aria-pressed="false">Eesti</button>
          </div>
          <button type="button" class="quiet" id="mic">Turn the microphone off</button>
          <a class="quiet" href="#check">Voice check</a>
        </nav>
      </div>

      <main class="desk">
        <div class="doc" id="doc" aria-label="Document"></div>
        <aside class="margin" id="margin"></aside>
      </main>
    </div>

    <div class="bar" id="bar" data-voice="listening">
      <div class="bar-in">
        <span class="wordmark" role="img" aria-label="Ütle">
          <span class="wordmark-u" aria-hidden="true">u<span class="dots"><i></i><i></i></span></span
          ><span aria-hidden="true">tle</span>
        </span>
        <div class="said" aria-live="polite">
          <p class="heard" id="heard"></p>
          <p class="answer"><b id="understood"></b> <span id="prompt"></span></p>
        </div>
        <div class="acts">
          <button type="button" class="yes" id="yes">Yes</button>
          <button type="button" class="no" id="no">No</button>
          <input class="typed" aria-label="Type instead of speaking" placeholder="Type instead of speaking" autocomplete="off" />
        </div>
      </div>
    </div>

    <script>
      const DOC = [
        ['h1', 'Minutes: supplier onboarding project'],
        ['p', 'Attendees: Kadri Tamm, Marten Kask, Liis Org'],
        ['h2', 'Summary'],
        ['p', 'The pilot with the first supplier went live on 28 September. The supplier reported two invoice errors in the first week, which were corrected the same day. The team agreed that the supplier portal needs clearer upload instructions before the second supplier joins.'],
        ['h2', 'Budget'],
        ['p', 'Spending is within plan. The revised budget must be sent to finance by Thursday.'],
        ['h2', 'Next steps'],
        ['li', 'Liis updates the upload instructions.'],
        ['h2', 'Risks'],
        ['p', 'The second supplier has not confirmed a start date.'],
      ]

      const SAY = [
        ['What to change', 'Change the budget deadline to Friday'],
        ['Yes, no, or only the corrected word', 'Not Wednesday. Tuesday.'],
        ['A paragraph number', 'Six'],
        ['Where to go', 'Go to budget. Next. Top.'],
        ['What to read aloud', 'Read paragraph four. Stop.'],
        ['To take the last edit back', 'Undo'],
        ['To be left alone', 'Stop listening. Wake up.'],
      ]

      const LISTEN = 'Say what to change, or a paragraph number.'
      const FRIDAY = 'Spending is within plan. The revised budget must be sent to finance by Friday.'

      /** Each state: the bar, the rows that differ from the plain document, and the margin. */
      const STATES = [
        {
          name: 'listening',
          voice: 'listening',
          heard: '',
          understood: 'Waiting for you to speak.',
          prompt: LISTEN,
        },
        {
          name: 'hearing',
          voice: 'hearing',
          heard: 'change the budget deadline to',
          understood: 'Waiting for you to speak.',
          prompt: LISTEN,
        },
        {
          name: 'thinking',
          voice: 'thinking',
          heard: 'Change the budget deadline to Friday',
          understood: '',
          prompt: 'Working on it.',
        },
        {
          name: 'confirming',
          voice: 'listening',
          heard: 'Change the budget deadline to Friday',
          understood: 'Budget: Thursday becomes Friday.',
          prompt: 'Say yes or no, or only the word to change.',
          confirm: true,
          rows: { 5: { tone: 'changed', html: 'Spending is within plan. The revised budget must be sent to finance by <del>Thursday</del><ins>Friday</ins>.' } },
        },
        {
          name: 'choosing',
          voice: 'listening',
          heard: 'Change supplier to vendor',
          understood: 'Which one?',
          prompt: 'Say a number from 1 to 3, or no.',
          rows: {
            0: { tone: 'ask', html: 'Minutes: <span class="highlight"><b class="badge">1</b>supplier</span> onboarding project' },
            3: { tone: 'ask', html: 'The pilot with the first <span class="highlight"><b class="badge">2</b>supplier</span> went live on 28 September. The supplier reported two invoice errors in the first week, which were corrected the same day. The team agreed that the supplier portal needs clearer upload instructions before the second supplier joins.' },
            9: { tone: 'ask', html: 'The second <span class="highlight"><b class="badge">3</b>supplier</span> has not confirmed a start date.' },
          },
        },
        {
          name: 'done',
          voice: 'listening',
          heard: 'Yes',
          understood: 'Done. Budget: Thursday becomes Friday.',
          prompt: LISTEN,
          rows: { 5: { tone: 'focus', html: FRIDAY } },
          log: ['Budget: Thursday becomes Friday'],
          tally: [1, 7, 0],
        },
        {
          name: 'help',
          voice: 'listening',
          heard: 'Help',
          understood: 'Here is what you can say.',
          prompt: '',
          help: true,
        },
        {
          name: 'microphone off',
          voice: 'off',
          heard: '',
          understood: 'The microphone is off.',
          prompt: 'Another tab or window is using speech recognition. Close it, then turn the microphone on here, or type instead.',
        },
      ]

      const el = (id) => document.getElementById(id)

      function render(index) {
        const s = STATES[index]
        el('bar').dataset.voice = s.voice
        el('heard').textContent = s.heard
        el('understood').textContent = s.understood
        el('prompt').textContent = s.prompt
        el('yes').hidden = !s.confirm
        el('no').hidden = !s.confirm
        el('mic').textContent = s.voice === 'off' ? 'Turn the microphone on' : 'Turn the microphone off'

        el('doc').innerHTML = DOC.map(([type, text], i) => {
          const row = s.rows?.[i]
          const body = (type === 'li' ? '<span class="bullet">•</span>' : '') + (row?.html ?? text)
          return `<div class="row" data-type="${type}" data-tone="${row?.tone ?? 'plain'}"><span class="num">${i + 1}</span><div class="text">${body}</div></div>`
        }).join('')

        const [edits, words, hands] = s.tally ?? [0, 0, 0]
        el('margin').innerHTML =
          (s.help
            ? `<section><h2>You can say</h2><dl>${SAY.map(([what, example]) => `<div><dt>${what}</dt><dd>${example}</dd></div>`).join('')}</dl></section>`
            : '') +
          `<section><h2>Changes</h2>${
            s.log ? `<ol>${s.log.map((line) => `<li>${line}</li>`).join('')}</ol>` : '<p style="margin:0">None yet. Every accepted edit is listed here.</p>'
          }</section>` +
          `<p class="tally"><b>${edits}</b><span>edits finished</span><b>${words}</b><span>words spoken</span><b>${hands}</b><span>times a hand was used</span></p>` +
          '<button type="button" class="quiet" style="align-self:start;text-decoration:underline;text-underline-offset:0.2em">Start again with the sample document</button>'

        document.querySelectorAll('#states button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === index)))
        history.replaceState(null, '', '#' + (index + 1))
      }

      function setTheme(theme) {
        if (theme === 'auto') delete document.documentElement.dataset.theme
        else document.documentElement.dataset.theme = theme
        document.querySelectorAll('#themes button').forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === theme)))
      }

      el('states').innerHTML = STATES.map((s, i) => `<button type="button">${i + 1} ${s.name}</button>`).join('')
      document.querySelectorAll('#states button').forEach((b, i) => b.addEventListener('click', () => render(i)))
      el('themes').innerHTML = ['auto', 'light', 'dark'].map((t) => `<button type="button">${t}</button>`).join('')
      document.querySelectorAll('#themes button').forEach((b) => b.addEventListener('click', () => setTheme(b.textContent)))

      window.addEventListener('keydown', (event) => {
        if (event.target instanceof HTMLInputElement) return
        const n = Number(event.key)
        if (n >= 1 && n <= STATES.length) render(n - 1)
        if (event.key === 't') setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark')
      })

      const params = new URLSearchParams(location.search)
      setTheme(params.get('theme') ?? 'auto')
      const start = Number(location.hash.slice(1))
      render(start >= 1 && start <= STATES.length ? start - 1 : 3)
    </script>
  </body>
</html>
