<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ütle: alustamine</title>
    <style>
      :root { --bg: #141414; --ink: #f5f1e8; --dim: #a8a399; --edge: #3a3a3a; --panel: #242424; --green: #3ddc84; --amber: #f0b429; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); }
      body { font: 22px/1.4 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, "Segoe UI", sans-serif; }
      /* The end of the page clears the strip at its tallest (192 px) plus the usual 48 px, as options.html does. */
      main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 240px; }
      h1 { font-size: 40px; margin: 0 0 8px; }
      .en { color: var(--dim); font-size: 18px; margin: 0; }
      .lead { margin: 0; font-size: 26px; }
      .how { margin: 12px 0 0; font-size: 22px; color: var(--amber); }
      .step { margin: 28px 0 0; padding: 20px 24px 24px; border: 3px solid var(--edge); border-radius: 20px; background: #1b1b1b; }
      .step[data-done="true"] { border-color: var(--green); }
      .head { position: relative; overflow: hidden; display: flex; align-items: center; gap: 20px; width: 100%; min-height: 96px; box-sizing: border-box;
        padding: 8px 16px; border-radius: 16px; border: 3px solid var(--edge); background: var(--panel); color: var(--ink); cursor: pointer; text-align: left;
        font: 700 32px/1.1 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, "Segoe UI", sans-serif; }
      .head:hover, .head:focus-visible { border-color: var(--dim); outline: none; }
      .head > span { position: relative; z-index: 1; }
      .num { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--ink); font-size: 30px; }
      .step[data-done="true"] .num { background: var(--green); border-color: var(--green); color: #141414; }
      .titles { flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .titles .sub { font-size: 18px; font-weight: 400; color: var(--dim); }
      .tick { flex: none; font-size: 22px; color: var(--green); visibility: hidden; }
      .step[data-done="true"] .tick { visibility: visible; }
      .body { margin: 16px 0 0; font-size: 24px; }
      .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 16px; }
      .choice { position: relative; overflow: hidden; min-height: 112px; box-sizing: border-box; padding: 12px 16px; border-radius: 16px;
        border: 3px solid var(--edge); background: var(--panel); color: var(--ink); cursor: pointer; text-align: center;
        font: 700 30px/1.1 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, "Segoe UI", sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
      .choice:hover, .choice:focus-visible { border-color: var(--dim); outline: none; }
      .choice[aria-pressed="true"] { border-color: var(--green); background: #1a2b22; }
      .choice[aria-pressed="true"]::after { content: ""; position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; border-radius: 50%; background: var(--green); }
      .choice > span { position: relative; z-index: 1; }
      .choice .sub { font-size: 18px; font-weight: 400; color: var(--dim); }
      .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--amber); opacity: .35; }
      .dwelling .fill { height: 100%; transition: height 1s linear; }
      .note { margin: 12px 0 0; font-size: 18px; color: var(--dim); }
      .fields[hidden] { display: none; }
      label { display: block; margin-top: 16px; font-size: 20px; color: var(--dim); }
      input { font: inherit; width: 100%; max-width: 720px; padding: 10px 12px; box-sizing: border-box; margin-top: 6px; background: var(--panel); color: var(--ink); border: 2px solid var(--edge); border-radius: 10px; }
      input:focus, textarea:focus { border-color: var(--amber); outline: none; }
      textarea { display: block; font: 700 34px/1.3 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, "Segoe UI", sans-serif; width: 100%; min-height: 120px; box-sizing: border-box;
        margin-top: 16px; padding: 12px 16px; background: var(--panel); color: var(--ink); border: 3px solid var(--amber); border-radius: 16px; resize: vertical; }
      .result { min-height: 1.4em; margin: 16px 0 0; font-size: 24px; color: var(--amber); }
      .result.ok { color: var(--green); }
      .examples { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 30px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p class="en" id="titleEn"></p>
      <p class="lead" id="intro"></p>
      <p class="en" id="introEn"></p>
      <p class="how" id="how"></p>
      <div id="steps"></div>
    </main>
    <script src="dist/page.js"></script>
    <script src="dist/welcome.js"></script>
  </body>
</html>
