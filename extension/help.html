<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mida saab öelda</title>
    <style>
      :root { --bg: #141414; --ink: #f5f1e8; --dim: #a8a399; --edge: #3a3a3a; --panel: #242424; --green: #3ddc84; --amber: #f0b429; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); }
      body { font: 22px/1.4 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, "Segoe UI", sans-serif; }
      /* The end of the page clears the strip at its tallest (192 px) plus the usual 48 px, as on the settings page. */
      .page { max-width: 1100px; margin: 0 auto; padding: 32px 24px 240px; }
      h1 { font-size: 40px; margin: 0 0 4px; }
      .en { color: var(--dim); font-size: 18px; margin: 0; }
      #hint { margin: 12px 0 0; font-size: 24px; color: var(--amber); }
      #groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
      .choice { position: relative; overflow: hidden; min-height: 112px; box-sizing: border-box; padding: 12px 16px; border-radius: 16px;
        border: 3px solid var(--edge); background: var(--panel); color: var(--ink); cursor: pointer; text-align: center;
        font: 700 28px/1.1 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, "Segoe UI", sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
      .choice:hover, .choice:focus-visible { border-color: var(--dim); outline: none; }
      .choice[aria-pressed="true"] { border-color: var(--green); background: #1a2b22; }
      .choice[aria-pressed="true"]::after { content: ""; position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; border-radius: 50%; background: var(--green); }
      .choice > span { position: relative; z-index: 1; }
      .choice .sub { font-size: 18px; font-weight: 400; color: var(--dim); }
      .choice .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--amber); opacity: .35; }
      .choice.dwelling .fill { height: 100%; transition: height 1s linear; }
      #open { margin-top: 32px; padding: 20px 24px 24px; border: 3px solid var(--green); border-radius: 20px; background: #1b1b1b; }
      #open h2 { font-size: 34px; margin: 0; }
      #intro { margin: 8px 0 0; font-size: 24px; color: var(--ink); }
      .phrase { padding: 16px 0; border-top: 1px solid var(--edge); }
      .phrase:first-of-type { margin-top: 16px; }
      .said { margin: 0; }
      .said .forms { display: block; font-size: 32px; font-weight: 700; line-height: 1.25; }
      .said .does { display: block; margin-top: 4px; font-size: 24px; }
      .phrase .en { margin-top: 4px; font-size: 20px; }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1 id="title"></h1>
        <p class="en" id="titleEn"></p>
        <p id="hint"></p>
      </header>
      <nav id="groups" aria-label="Rühmad"></nav>
      <main id="open" aria-live="polite"></main>
    </div>
    <script src="dist/page.js"></script>
    <script src="dist/help.js"></script>
  </body>
</html>
