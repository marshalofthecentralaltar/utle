<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <title>Ilm (consent stand-in)</title>
    <!-- A trimmed copy of ilmateenistus.ee's bottom consent bar (30.1, 30.4): fixed, bottom 0, 48 px, "Nõustun".
         ?late=1: no bar at load; window.showBar() and window.hideBar() put it up and take it away. -->
    <style>
      body { font: 18px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; background: #f4f6f8; color: #1d2733; }
      main { max-width: 900px; }
      #tcpCookieConsent { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; z-index: 1000; box-sizing: border-box;
        display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #003b5c; color: #fff; font-size: 16px; }
      #tcpCookieConsent button { font: inherit; padding: 6px 18px; border: 0; border-radius: 4px; cursor: pointer; }
      #accept { background: #ffd200; color: #1d2733; font-weight: 700; }
      #refuse { background: #e0e6eb; color: #1d2733; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ilm täna</h1>
      <p>Tallinnas pilves, kohati sajab vihma. Õhutemperatuur 6 kuni 9 kraadi. Tuul edelast 4 kuni 9 meetrit sekundis.</p>
      <p>Homme on selgem, õhtul võib saarte kohal udu tekkida.</p>
    </main>
    <script>
      const bar = () => {
        const s = document.createElement('section')
        s.id = 'tcpCookieConsent'
        s.innerHTML = '<span>See veebileht kasutab küpsiseid. Lisateave: <a href="#">küpsised</a>.</span><button id="refuse" type="button">Keeldun</button><button id="accept" type="button">Nõustun</button>'
        s.querySelector('#accept').addEventListener('click', () => {
          window.accepted = (window.accepted || 0) + 1
          s.remove()
        })
        s.querySelector('#refuse').addEventListener('click', () => s.remove())
        return s
      }
      window.accepted = 0
      window.showBar = () => document.body.append(bar())
      window.hideBar = () => document.getElementById('tcpCookieConsent')?.remove()
      if (!new URLSearchParams(location.search).has('late')) window.showBar()
    </script>
  </body>
</html>
