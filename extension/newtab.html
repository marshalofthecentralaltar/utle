<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uus vaheleht</title>
    <style>
      html, body { margin: 0; background: #1b1b1b; color: #fff; }
      body { font: 24px/1.4 system-ui, "Segoe UI", sans-serif; }
      main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
      h1 { font-size: 40px; margin: 0 0 8px; }
      #hint { margin: 0 0 24px; color: #ffd400; }
      #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      .tile { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
        min-height: 120px; box-sizing: border-box; padding: 16px; border-radius: 16px; border: 4px solid #fff;
        background: #2b2b2b; color: #fff; text-decoration: none; font: 700 34px/1.1 system-ui, "Segoe UI", sans-serif; text-align: center; }
      .tile:first-child { background: #075e54; border-color: #25d366; }
      .tile:hover, .tile:focus-visible { border-color: #ffd400; outline: none; }
      .tile .name { position: relative; z-index: 1; }
      .tile .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #ffd400; opacity: .5; }
      .tile.dwelling .fill { height: 100%; transition: height 1s linear; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="hint"></p>
      <nav id="tiles"></nav>
    </main>
    <script src="dist/page.js"></script>
    <script src="dist/newtab.js"></script>
  </body>
</html>
