<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uus vaheleht</title>
    <style>
      :root { --bg: #141414; --ink: #f5f1e8; --dim: #a8a399; --edge: #3a3a3a; --panel: #242424; --green: #3ddc84; --amber: #f0b429; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); }
      body { font: 24px/1.4 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, "Segoe UI", sans-serif; }
      main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 48px; }
      h1 { font-size: 40px; margin: 0 0 8px; }
      #hint { margin: 0 0 24px; color: var(--amber); }
      #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      .tile { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
        min-height: 120px; box-sizing: border-box; padding: 16px; border-radius: 16px; border: 3px solid var(--edge);
        background: var(--panel); color: var(--ink); text-decoration: none; font-size: 34px; line-height: 1.1; font-weight: 700; text-align: center; }
      .tile:first-child { border-color: var(--green); }
      .tile:hover, .tile:focus-visible { border-color: var(--amber); outline: none; }
      .tile .name { position: relative; z-index: 1; }
      .tile .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--amber); opacity: .35; }
      .tile.dwelling .fill { height: 100%; transition: height 1s linear; }
      #examples { margin: 40px 0 0; padding-top: 20px; border-top: 1px solid var(--edge); display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 28px; color: var(--ink); font-size: 26px; line-height: 1.3; }
      #examples .lead { color: var(--dim); font-size: 22px; }
      #examples .ex { transition: opacity .4s; }
      #examples.fade .ex { opacity: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="hint"></p>
      <nav id="tiles"></nav>
      <p id="examples" aria-live="off"></p>
    </main>
    <script src="dist/page.js"></script>
    <script src="dist/newtab.js"></script>
  </body>
</html>
